syntax = "proto3";

package connect.v1;

option go_package = "github.com/connect/gateway/gen/connect/v1;connectv1";

// SmsGateway — контракт Connect поверх easysms/v3.
// Клиент авторизуется метаданными authorization: Bearer <api-ключ Connect>.
// Шлюз проверяет свои условия и только потом вызывает
// POST https://xml.smstec.ru/api/v3/easysms/{connect_id}/SendMessage.
// Подпись уходит как originator. Статусы поставщик присылает на /easysms/v3/webhook.
// OTP — это flash_call: код приходит в вебхуке и проверяется локально.
service SmsGateway {
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse);
  rpc CreateOtp(CreateOtpRequest) returns (StatusResponse);
  rpc ValidateOtp(ValidateOtpRequest) returns (StatusResponse);
  rpc GetStatus(GetStatusRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc GetBalance(Empty) returns (BalanceResponse);
  rpc AuthCheck(Empty) returns (StatusResponse);
}

message Empty {}

message Receiver {
  string phone = 1;
}

message SendSmsRequest {
  repeated Receiver receivers = 1;
  string text = 2;
  string sign = 3;
  int64 date_send = 4;
  string callback_url = 5;
  bool short_link = 6;
  bool translit = 7;
  repeated int64 group_ids = 8;
  int64 smooth_until = 9;
}

message SendSmsResponse {
  bool success = 1;
  string message = 2;
  repeated Message data = 3;
  int32 excluded_duplicates = 4;
  string cost = 5;
  bool held_for_moderation = 6;
}

message Message {
  int64 id = 1;
  string from = 2;
  string number = 3;
  string text = 4;
  int32 status = 5;
  string extend_status = 6;
  string channel = 7;
  string cost = 8;
  int64 date_create = 9;
  int64 date_send = 10;
  int64 date_answer = 11;
}

message CreateOtpRequest {
  string phone = 1;
}

message ValidateOtpRequest {
  string phone = 1;
  string code = 2;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message GetStatusRequest {
  int64 id = 1;
}

message ListMessagesRequest {
  string number = 1;
  string text = 2;
  int32 page = 3;
}

message ListMessagesResponse {
  bool success = 1;
  repeated Message data = 2;
  int32 page = 3;
  int32 total = 4;
}

message BalanceResponse {
  bool success = 1;
  string balance = 2;
}
