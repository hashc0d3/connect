services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
      POSTGRES_DB: connect
    ports:
      - "5434:5432"
    volumes:
      - connect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://connect:connect@postgres:5432/connect?sslmode=disable
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50051"
      PUBLIC_LINK_BASE: http://localhost:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      EASYSMS_BASE_URL: ${EASYSMS_BASE_URL:-https://xml.smstec.ru}
      EASYSMS_LOGIN: ${EASYSMS_LOGIN:-}
      EASYSMS_PASSWORD: ${EASYSMS_PASSWORD:-}
      EASYSMS_CONNECT_ID: ${EASYSMS_CONNECT_ID:-}
      EASYSMS_WEBHOOK_TOKEN: ${EASYSMS_WEBHOOK_TOKEN:-}
      EASYSMS_MOCK: ${EASYSMS_MOCK:-true}
      MOCK_REVEAL_OTP: ${MOCK_REVEAL_OTP:-true}
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://connect:connect@postgres:5432/connect?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      GATEWAY_HTTP_URL: http://gateway:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

volumes:
  connect_pg:
